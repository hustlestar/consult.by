<section data-bs-version="5.1" class="features03 devicem5 cid-uxvqIEFLBd" id="blog">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 item">
                <div class="title-wrapper">
                    <h2 class="mbr-section-title mbr-fonts-style display-2"><a class="text-black" href="../blog.html">Последние Статьи:</a></h2>
                </div>
            </div>
            {% for post in site.posts limit:3 %}
            <div class="item features-image col-12 col-lg-4">
                <div class="item-wrapper">
                    <div class="item-img">
                        <a href="{{ post.permalink }}">
                            {% if post.image != "" %}
                            <img src="{{post.image}}" alt="{{ post.image_alt }}">
                            {% else %}
                            <img src="../images/photo-1585846328761-acbf5a12beea.jpeg" alt="">
                            {% endif %}
                        </a>
                    </div>
                    <div class="item-content">
                        <p class="card-date mbr-fonts-style display-4">{{ post.date | date: "%Y-%m-%d" }}</p>
                        <h4 class="card-title mbr-fonts-style display-5">{{ post.title }}</h4>
                        <div class="mbr-section-btn">
                            <a class="btn btn-primary-outline display-4" href="{{ post.permalink }}">Читать статью</a>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
